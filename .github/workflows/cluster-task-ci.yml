name: Cluster Task CI

on:
  pull_request:
    paths:
      - 'cluster-task/**'
      - '.github/workflows/cluster-task-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'cluster-task/**'
      - '.github/workflows/cluster-task-ci.yml'

permissions:
  contents: read

concurrency:
  group: cluster-task-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.PPU_TEST_IMAGE }}
  NAMESPACE: ppu-sched
  COMMAND: |
    set -euo pipefail
    test -f /workspace/source/cluster-task/action.yml
    test -f /workspace/source/README.md
    test -d /nas_aisw
    test -d /mnt/wl_nas
    echo "RANK=$RANK NODE_RANK=$NODE_RANK WORLD_SIZE=$WORLD_SIZE NNODES=$NNODES NPROC_PER_NODE=$NPROC_PER_NODE"
    ppu-smi
    sleep 30

  MASTER_COMMAND: |
    set -euo pipefail
    test "$RANK" = 0
    test "$WORLD_SIZE" = 2
    test "$NNODES" = 2
    test "$NPROC_PER_NODE" = 1
    test "$CI_MASTER_SETUP" = setup-0
    test -f /workspace/source/cluster-task/action.yml
    job_id="$(< /run/cluster/job-id)"
    registry="/mnt/wl_nas/devops/runtime/master/$job_id/nodes"
    mkdir "/mnt/wl_nas/devops/runtime/master/$job_id/master-command-once"
    jq -e 'type == "array" and length == 2 and .[0].rank == 0 and .[1].rank == 1 and all(.[]; .cards == 1 and .port >= 1 and .port <= 65535)' "$CLUSTER_NODES_FILE"
    check_node='set -euo pipefail
    test "$RANK" = "$1"
    test "$NODE_RANK" = "$1"
    test "$WORLD_SIZE" = 2
    test "$CI_MASTER_SETUP" = "setup-$1"
    test -s /run/cluster/known_hosts
    test -s /run/cluster/authorized_keys
    test -s /run/cluster/identity
    for peer in 0 1; do
      peer_host="$(jq -r --argjson rank "$peer" '\''.[$rank].host'\'' "$CLUSTER_NODES_FILE")"
      cluster-exec "$peer_host" /bin/bash -c '\''set -euo pipefail; test "$RANK" = "$1"; test "$WORLD_SIZE" = 2'\'' fixture "$peer"
    done
    printf "rank=%s world_size=%s setup=%s ok\\n" "$RANK" "$WORLD_SIZE" "$CI_MASTER_SETUP"
    '
    for rank in 0 1; do
      jq -e --argjson rank "$rank" --arg job "$job_id" '.rank == $rank and .jobid == $job and .port >= 1 and .port <= 65535' "$registry/$rank.json"
      host="$(jq -r --argjson rank "$rank" '.[$rank].host' "$CLUSTER_NODES_FILE")"
      cluster-exec "$host" /bin/bash -c "$check_node" fixture "$rank"
    done
    printf 'master-command-once\n'

jobs:
  validate:
    name: Validate composite action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate action metadata
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          metadata = YAML.safe_load(File.read("cluster-task/action.yml"), aliases: true)
          abort "action.yml must define a composite action" unless metadata.dig("runs", "using") == "composite"
          steps = metadata.dig("runs", "steps")
          abort "action.yml must define composite steps" unless steps.is_a?(Array) && !steps.empty?
          expressions = metadata.fetch("outputs").values.map { |output| output["value"] } + steps.flat_map { |step| (step["env"] || {}).values }
          abort "status functions are only supported in step conditions" if expressions.any? { |value| value.to_s.match?(/\b(always|cancelled|failure|success)\(/) }

          %w[image command].each do |input|
            abort "#{input} must be a required input" unless metadata.dig("inputs", input, "required") == true
          end
          RUBY

      - name: Install test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server jq util-linux sudo

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "$script"
          done < <(find cluster-task/scripts -type f -name '*.sh' -print0)

      - name: Test resource naming
        shell: bash
        run: |
          set -euo pipefail

          name_one=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-a MATRIX_JSON='{"model":"llama"}' bash cluster-task/scripts/job-name.sh)
          name_repeat=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-a MATRIX_JSON='{"model":"llama"}' bash cluster-task/scripts/job-name.sh)
          name_other_runner=$(env GITHUB_REPOSITORY_OWNER=flytiger-eco GITHUB_JOB_NAME=train GITHUB_RUN_ID=123456 GITHUB_RUN_ATTEMPT=1 PPU_RUNNER_NAME=runner-b MATRIX_JSON='{"model":"llama"}' bash cluster-task/scripts/job-name.sh)

          [[ "$name_one" == "$name_repeat" ]]
          [[ "$name_one" != "$name_other_runner" ]]
          [[ "$name_one" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?-[a-f0-9]{6}$ ]]
          (( ${#name_one} <= 52 ))

      - name: Test job lifecycle
        shell: bash
        run: python3 cluster-task/tests/test-lifecycle.py

      - name: Test workspace staging and CI checks
        shell: bash
        run: python3 cluster-task/tests/test-staging.py

      - name: Test real SSH mesh and port fallback
        shell: bash
        run: |
          sudo python3 - <<'PY'
          import importlib.util
          import unittest

          path = "cluster-task/tests/test-master-runtime.py"
          spec = importlib.util.spec_from_file_location("master_runtime_tests", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          real = getattr(module, "RealSshdTests", None)
          names = unittest.defaultTestLoader.getTestCaseNames(real) if real else []
          coverage = {
              "two-node public-key SSH": [name for name in names if "two_node" in name],
              "preferred SSH port collision on a real sshd": [name for name in names
                  if any(word in name for word in ("collision", "conflict", "fallback"))],
          }
          skipped = {test.id().rsplit(".", 1)[-1] for test, reason in result.skipped}
          for label, tests in coverage.items():
              if not tests or all(name in skipped for name in tests):
                  raise SystemExit("Real SSH coverage is missing or skipped: " + label)
          if any("setUpClass" in test.id() and "RealSshdTests" in test.id()
                 for test, reason in result.skipped):
              raise SystemExit("Real SSH tests must not be skipped on the Linux runner")
          PY

      - name: Test APT SSH installer
        shell: bash
        run: python3 cluster-task/tests/test-ssh-install.py

      - name: Test RPM SSH installer
        shell: bash
        run: python3 cluster-task/tests/test-ssh-rpm.py

  ppu-basic:
    name: PPU ${{ matrix.scenario }}
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: 890P single card
            nnodes: 0
            cards: 1
            board: ZW-M890P
          - scenario: 890P eight cards
            nnodes: 0
            cards: 8
            board: ZW-M890P
          - scenario: 890P two nodes
            nnodes: 2
            cards: 8
            board: ZW-M890P
          - scenario: 810E single card
            nnodes: 0
            cards: 1
            board: OAM-810E
          - scenario: ZW-810E single card
            nnodes: 0
            cards: 1
            board: ZW-810E
          - scenario: 810E eight cards
            nnodes: 0
            cards: 8
            board: OAM-810E
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify ${{ matrix.scenario }}
        id: ppu
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: ${{ matrix.nnodes }}
          nproc_per_node: ${{ matrix.cards }}
          node_selector: board-type=${{ matrix.board }}
          dmesg_policy: always
          timeout_minutes: 10
          command: ${{ env.COMMAND }}

      - name: Check action outputs
        shell: bash
        env:
          JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
          QUEUE_DURATION_SECONDS: ${{ steps.ppu.outputs.queue_duration_seconds }}
          OCCUPIED_PPU_CARD_HOURS: ${{ steps.ppu.outputs.occupied_ppu_card_hours }}
          EXECUTION_PPU_CARD_HOURS: ${{ steps.ppu.outputs.execution_ppu_card_hours }}
        run: |
          echo "job_name=${JOB_NAME} job_status=${JOB_STATUS} task_pods=${TASK_PODS}"
          echo "queue_duration_seconds=${QUEUE_DURATION_SECONDS} occupied_ppu_card_hours=${OCCUPIED_PPU_CARD_HOURS} execution_ppu_card_hours=${EXECUTION_PPU_CARD_HOURS}"
          test -n "$JOB_NAME"
          test "$JOB_STATUS" = succeeded
          [[ "$QUEUE_DURATION_SECONDS" =~ ^[0-9]+$ ]]
          [[ "$OCCUPIED_PPU_CARD_HOURS" =~ ^[0-9]+\.[0-9]{4}$ ]]
          [[ "$EXECUTION_PPU_CARD_HOURS" =~ ^[0-9]+\.[0-9]{4}$ ]]

  ppu-lifecycle:
    name: PPU ${{ matrix.scenario }} lifecycle
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: instant success
            command: "printf 'early-workload-log\\nfinal-workload-log\\n'; exit 0"
            status: succeeded
            outcome: success
            timeout: 10
          - scenario: business failure
            command: "printf 'early-workload-log\\nfinal-workload-log\\n'; exit 7"
            status: failed
            outcome: failure
            timeout: 10
          - scenario: execution timeout
            command: "printf 'early-workload-log\\n'; sleep 300"
            status: timeout
            outcome: failure
            timeout: 3
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exercise split lifecycle
        id: lifecycle
        continue-on-error: true
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          timeout_minutes: ${{ matrix.timeout }}
          command: ${{ matrix.command }}

      - name: Verify lifecycle result and cleanup
        shell: bash
        env:
          JOB_NAME: ${{ steps.lifecycle.outputs.job_name }}
          JOB_STATUS: ${{ steps.lifecycle.outputs.job_status }}
          OUTCOME: ${{ steps.lifecycle.outcome }}
          EXPECTED_STATUS: ${{ matrix.status }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXECUTION_HOURS: ${{ steps.lifecycle.outputs.execution_ppu_card_hours }}
        run: |
          test "$JOB_STATUS" = "$EXPECTED_STATUS"
          test "$OUTCOME" = "$EXPECTED_OUTCOME"
          pods="$(kubectl get pods -n "$NAMESPACE" -l "ppu-job=$JOB_NAME" -o name)"
          test -z "$pods"
          if [ "$EXPECTED_STATUS" = timeout ]; then
            awk -v hours="$EXECUTION_HOURS" 'BEGIN { exit !(hours > 0) }'
          fi

  ssh-apt-cache:
    name: APT SSH install and offline cache
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SSH online, then reuse the cache without network
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/openssh-cache"
          mkdir -p "$cache"
          docker pull ubuntu:24.04
          image="$(docker image inspect --format '{{.Id}}' ubuntu:24.04)"
          deadline="$(( $(date +%s) + 900 ))"
          docker run --rm \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-task/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            "$image" /bin/bash /action/install-ssh.sh 2>&1 \
            | tee "$RUNNER_TEMP/openssh-download.log"
          grep -q 'published authenticated dependency cache' "$RUNNER_TEMP/openssh-download.log"
          test -n "$(sudo find "$cache" -path '*metadata/mirrors.aliyun.com*InRelease' -type f -print -quit)"
          test -n "$(sudo find "$cache" -name COMPLETE -type f -print -quit)"
          deadline="$(( $(date +%s) + 600 ))"
          docker run --rm --network none \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-task/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            "$image" /bin/bash /action/install-ssh.sh 2>&1 \
            | tee "$RUNNER_TEMP/openssh-offline.log"
          grep -q 'authenticated offline cache hit' "$RUNNER_TEMP/openssh-offline.log"

  ssh-rpm-cache:
    name: RPM SSH install on ${{ matrix.os }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: CentOS 7
            image: quay.io/centos/centos:7.9.2009
          - os: CentOS Stream 8
            image: quay.io/centos/centos:stream8
          - os: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - os: Alibaba Cloud Linux 2
            image: alibaba-cloud-linux-2-registry.cn-hangzhou.cr.aliyuncs.com/alinux2/alinux2:latest
          - os: Alibaba Cloud Linux 3
            image: alibaba-cloud-linux-3-registry.cn-hangzhou.cr.aliyuncs.com/alinux3/alinux3:220901.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install signed RPMs and log in over SSH
        shell: bash
        env:
          RPM_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/openssh-rpm-cache"
          mkdir -p "$cache"
          docker pull "$RPM_IMAGE"
          image="$(docker image inspect --format '{{.Id}}' "$RPM_IMAGE")"
          deadline="$(( $(date +%s) + 900 ))"
          smoke='set -euo pipefail
          /bin/bash /action/install-ssh.sh
          mkdir -p /run/sshd /run/cluster
          chmod 0700 /run/cluster
          ssh-keygen -q -t ed25519 -N "" -f /run/cluster/identity
          ssh-keygen -q -t ed25519 -N "" -f /run/cluster/hostkey
          printf "restrict " > /run/cluster/authorized_keys
          cat /run/cluster/identity.pub >> /run/cluster/authorized_keys
          read -r type key comment < /run/cluster/hostkey.pub
          printf "rpm-check %s %s\n" "$type" "$key" > /run/cluster/known_hosts
          printf "%s\n" "Port 2222" "ListenAddress 127.0.0.1" "HostKey /run/cluster/hostkey" "AuthorizedKeysFile /run/cluster/authorized_keys" "PidFile /run/cluster/sshd.pid" "PermitRootLogin prohibit-password" "PubkeyAuthentication yes" "PasswordAuthentication no" "KbdInteractiveAuthentication no" "ChallengeResponseAuthentication no" "AuthenticationMethods publickey" "UsePAM yes" "PermitUserRC no" > /run/cluster/sshd_config
          /usr/sbin/sshd -t -f /run/cluster/sshd_config
          /usr/sbin/sshd -D -e -f /run/cluster/sshd_config &
          listener=$!
          trap "kill $listener 2>/dev/null || true; wait $listener 2>/dev/null || true" EXIT
          source /action/master-worker.sh
          cluster_ssh_options
          for attempt in {1..10}; do
            if result=$(/usr/bin/ssh "${CLUSTER_SSH_ARGS[@]}" -o HostKeyAlias=rpm-check -p 2222 root@127.0.0.1 "printf rpm-ssh-ok"); then
              test "$result" = rpm-ssh-ok
              break
            fi
            test "$attempt" -lt 10
            sleep 1
          done
          /usr/bin/jq --version'
          docker run --rm \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-task/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/pki/tls/certs/ca-bundle.crt:ro \
            "$image" /bin/bash -c "$smoke" 2>&1 \
            | tee "$RUNNER_TEMP/rpm-download.log"
          test -n "$(sudo find "$cache" -name COMPLETE -type f -print -quit)"
          deadline="$(( $(date +%s) + 600 ))"
          docker run --rm --network none \
            -e PPU_DEADLINE="$deadline" \
            -v "$PWD/cluster-task/scripts:/action:ro" \
            -v "$cache:/mnt/wl_nas/devops/cache/openssh:ro" \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/pki/tls/certs/ca-bundle.crt:ro \
            "$image" /bin/bash -c "$smoke" 2>&1 \
            | tee "$RUNNER_TEMP/rpm-offline.log"
          grep -q 'authenticated offline RPM cache hit' "$RUNNER_TEMP/rpm-offline.log"

  ppu-master:
    name: PPU master ${{ matrix.scenario }}
    needs: [validate, ssh-apt-cache]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: success
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'exit 0'
            status: succeeded
            outcome: success
            timeout: 10
          - scenario: command-failure
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'printf 7 > "$CI_MASTER_PROOF_DIR/master-command-fault"; chmod 0644 "$CI_MASTER_PROOF_DIR/master-command-fault"; exit 7'
            status: failed
            outcome: failure
            timeout: 10
          - scenario: setup-failure
            setup: 'export CI_MASTER_SETUP="setup-$RANK"; if [ "$RANK" = 1 ]; then printf 7 > "$CI_MASTER_PROOF_DIR/worker-setup-fault"; chmod 0644 "$CI_MASTER_PROOF_DIR/worker-setup-fault"; exit 7; fi'
            workload: 'printf "The master command ran after a worker setup failure\\n"; exit 0'
            status: failed
            outcome: failure
            timeout: 10
          - scenario: timeout
            setup: 'export CI_MASTER_SETUP="setup-$RANK"'
            workload: 'printf started > "$CI_MASTER_PROOF_DIR/timeout-command-started"; chmod 0644 "$CI_MASTER_PROOF_DIR/timeout-command-started"; sleep 300'
            status: timeout
            outcome: failure
            timeout: 3
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Secret permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /opt/bin/kubectl ]; then export PATH="/opt/bin:$PATH"; fi
          command -v kubectl
          for verb in create delete get; do
            if ! timeout --signal=KILL 10s kubectl auth can-i "$verb" secrets -n "$NAMESPACE"; then
              printf '::error::Missing Secret %s permission in namespace %s\n' "$verb" "$NAMESPACE"
              exit 1
            fi
          done

      - name: Create proof directory
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "/wl_nas/devops/master-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXXXX")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"

      - name: Run two-node master scenario
        id: master
        continue-on-error: true
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: 2
          nproc_per_node: 1
          node_selector: board-type=ZW-M890P
          launch_mode: master
          ssh_port: 2222
          extra_env: CI_MASTER_PROOF_DIR=${{ steps.proof.outputs.directory }}
          setup_command: |
            printf 'setup-%s\n' "$RANK" > "$CI_MASTER_PROOF_DIR/setup-$RANK"
            chmod 0644 "$CI_MASTER_PROOF_DIR/setup-$RANK"
            ${{ matrix.setup }}
          timeout_minutes: ${{ matrix.timeout }}
          job_suffix: master-${{ matrix.scenario }}
          command: |
            printf reached > "$CI_MASTER_PROOF_DIR/master-command-reached"
            chmod 0644 "$CI_MASTER_PROOF_DIR/master-command-reached"
            ${{ env.MASTER_COMMAND }}
            ${{ matrix.workload }}

      - name: Verify master result
        if: always() && steps.master.outcome != 'skipped'
        shell: bash
        env:
          JOB_STATUS: ${{ steps.master.outputs.job_status }}
          OUTCOME: ${{ steps.master.outcome }}
          EXPECTED_STATUS: ${{ matrix.status }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXECUTION_HOURS: ${{ steps.master.outputs.execution_ppu_card_hours }}
          SCENARIO: ${{ matrix.scenario }}
          PROOF_DIR: ${{ steps.proof.outputs.directory }}
        run: |
          if [ "$SCENARIO" = setup-failure ]; then
            test -s "$PROOF_DIR/setup-1"
            test "$(< "$PROOF_DIR/worker-setup-fault")" = 7
            test ! -e "$PROOF_DIR/master-command-reached"
          else
            test -s "$PROOF_DIR/setup-0"
            test -s "$PROOF_DIR/setup-1"
            test -s "$PROOF_DIR/master-command-reached"
          fi
          if [ "$SCENARIO" = command-failure ]; then
            test "$(< "$PROOF_DIR/master-command-fault")" = 7
          elif [ "$SCENARIO" = timeout ]; then
            test -s "$PROOF_DIR/timeout-command-started"
          fi
          test "$JOB_STATUS" = "$EXPECTED_STATUS"
          test "$OUTCOME" = "$EXPECTED_OUTCOME"
          if [ "$EXPECTED_STATUS" = timeout ]; then
            awk -v hours="$EXECUTION_HOURS" 'BEGIN { exit !(hours > 0) }'
          fi

      - name: Verify master cleanup
        if: always() && steps.master.outputs.job_name != ''
        shell: bash
        env:
          JOB_NAME: ${{ steps.master.outputs.job_name }}
        run: |
          set -euo pipefail
          test -n "$JOB_NAME"
          pods="$(timeout --signal=KILL 10s kubectl get pods -n "$NAMESPACE" -l "ppu-job=$JOB_NAME" -o name)"
          test -z "$pods"
          for resource in svc podgroups.scheduling.x-k8s.io; do
            remaining="$(timeout --signal=KILL 10s kubectl get "$resource" "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found=true -o name)"
            test -z "$remaining"
          done
          secret="$(timeout --signal=KILL 10s kubectl get secret "$JOB_NAME-ssh" -n "$NAMESPACE" --ignore-not-found=true -o name)"
          test -z "$secret"
          # Runtime directories carry a per-attempt nonce; only this job's prefix is inspected.
          shopt -s nullglob
          runtime_dirs=(/wl_nas/devops/runtime/master/"$JOB_NAME"-*)
          test "${#runtime_dirs[@]}" -eq 0

      - name: Remove proof directory
        if: always() && steps.proof.outputs.directory != ''
        shell: bash
        env:
          PROOF_DIR: ${{ steps.proof.outputs.directory }}
        run: |
          set -euo pipefail
          prefix="/wl_nas/devops/master-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          suffix="${PROOF_DIR#"$prefix"}"
          [[ "$suffix" =~ ^[a-zA-Z0-9]+$ ]]
          test "$PROOF_DIR" = "$prefix$suffix"
          test ! -L "$PROOF_DIR"
          rm -rf -- "$PROOF_DIR"

  ppu-resource-defaults:
    name: Default resources for ${{ matrix.board }}
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: ZW-M890P
            cpu: 31
            memory_gi: 256
          - board: OAM-810E
            cpu: 11
            memory_gi: 112
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify default limits
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: 0
          nproc_per_node: 1
          job_suffix: resource-${{ matrix.board }}
          node_selector: board-type=${{ matrix.board }}
          dmesg_policy: always
          timeout_minutes: 10
          command: |
            ${{ env.COMMAND }}
            python3 - <<'PY'
            from pathlib import Path

            expected_cpu = ${{ matrix.cpu }}
            expected_memory = ${{ matrix.memory_gi }} * 1024**3

            if Path("/sys/fs/cgroup/cpu.max").exists():
                quota, period = Path("/sys/fs/cgroup/cpu.max").read_text().split()
            else:
                quota = Path("/sys/fs/cgroup/cpu/cpu.cfs_quota_us").read_text().strip()
                period = Path("/sys/fs/cgroup/cpu/cpu.cfs_period_us").read_text().strip()
            if quota == "max" or int(quota) / int(period) != expected_cpu:
                raise SystemExit(f"CPU limit mismatch: expected={expected_cpu}, quota={quota}, period={period}")

            if Path("/sys/fs/cgroup/memory.max").exists():
                memory = Path("/sys/fs/cgroup/memory.max").read_text().strip()
            else:
                memory = Path("/sys/fs/cgroup/memory/memory.limit_in_bytes").read_text().strip()
            if memory == "max" or int(memory) != expected_memory:
                raise SystemExit(f"memory limit mismatch: expected={expected_memory}, actual={memory}")
            PY

  ppu-gang-block:
    name: Block an unsatisfied 8-node 810E gang
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Request eight 810E nodes
        id: gang
        continue-on-error: true
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: 8
          nproc_per_node: 16
          node_selector: board-type=OAM-810E
          dmesg_policy: on_failure
          timeout_minutes: 3
          command: echo 'The blocked gang must not start' && exit 1

      - name: Confirm the gang timed out
        shell: bash
        env:
          GANG_OUTCOME: ${{ steps.gang.outcome }}
          GANG_STATUS: ${{ steps.gang.outputs.job_status }}
        run: |
          echo "outcome=${GANG_OUTCOME} job_status=${GANG_STATUS}"
          test "$GANG_OUTCOME" = failure
          test "$GANG_STATUS" = timeout

  prepare-artifact:
    name: Prepare staging fixture
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build fixture
        shell: bash
        run: |
          mkdir -p test-artifact
          printf 'ppu-action-ci\n' > test-artifact/verify-marker.txt

      - name: Upload fixture
        uses: actions/upload-artifact@v4
        with:
          name: ppu-action-ci-fixture
          path: test-artifact/

  ppu-artifact:
    name: Artifact staging on ${{ matrix.scenario }}
    needs: prepare-artifact
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: one card
            nnodes: 0
            cards: 1
          - scenario: two nodes
            nnodes: 2
            cards: 8
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Check out action
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download fixture outside workspace
        uses: actions/download-artifact@v4
        with:
          name: ppu-action-ci-fixture
          path: ${{ runner.temp }}/downloaded-artifact

      - name: Verify source and artifact staging
        uses: $/cluster-task
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          nnodes: ${{ matrix.nnodes }}
          nproc_per_node: ${{ matrix.cards }}
          node_selector: board-type=ZW-M890P
          dmesg_policy: always
          timeout_minutes: 10
          artifact_paths: ${{ runner.temp }}/downloaded-artifact
          command: |
            set -euo pipefail
            test -f /workspace/source/cluster-task/action.yml
            test -f /workspace/source/README.md
            test -f /workspace/source/downloaded-artifact/verify-marker.txt
            grep -qx ppu-action-ci /workspace/source/downloaded-artifact/verify-marker.txt
            ppu-smi

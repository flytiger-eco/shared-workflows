name: Reusable Push Temporary Wheel

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Artifact name saved by the caller using actions/upload-artifact@v4 in the current run; the calling job must declare needs on the producing job'
        required: true
        type: string
      repo:
        description: 'Actual source repository used to build the wheels, in owner/repo format; empty when not provided; never inferred from the triggering repository'
        required: false
        type: string
        default: ''
      commit:
        description: 'Full 40-character commit SHA actually checked out for the wheel build; empty when not provided'
        required: false
        type: string
        default: ''
      branch:
        description: 'Actual source branch; leave empty when unknown or not applicable'
        required: false
        type: string
        default: ''
      tag:
        description: 'Tag pointing to the build commit; leave empty when none; multiple tags may be passed as one comma-separated string'
        required: false
        type: string
        default: ''
      extra_info:
        description: 'Reserved for compatibility; accepted but currently ignored and not written as an Artifactory property'
        required: false
        type: string
        default: ''
      template_repository:
        description: 'Repository containing this workflow and the upload script, in owner/repo format'
        required: false
        type: string
        default: flytiger-eco/shared-workflows
      template_ref:
        description: 'Must match the ref used to call this workflow; a commit SHA is recommended; use github.sha for same-repository relative-path calls'
        required: true
        type: string
    outputs:
      upload_url:
        description: 'Batch directory URL for all uploaded .whl files, using one Asia/Shanghai (UTC+08:00) timestamp in YYYY-MM-DD-HHmm format'
        value: ${{ jobs.push-wheel.outputs.upload_url }}
    secrets:
      template_token:
        description: 'Read-only token for checking out a private template repository; usually unnecessary for same-repository calls or public templates'
        required: false
      release_username:
        description: 'Publishing username from a caller repository or organization Actions Secret'
        required: true
      release_token:
        description: 'Publishing token from a caller repository or organization Actions Secret; requires upload and item-property update permissions'
        required: true

permissions:
  contents: read

jobs:
  push-wheel:
    name: Upload temporary wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      upload_url: ${{ steps.upload.outputs.upload_url }}
    steps:
      - name: Validate artifact name
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_NAME//[[:space:]]/}" ]]; then
            printf '%s\n' '::error::artifact_name must not be empty' >&2
            exit 1
          fi

      - name: Check out template tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Download only the named artifact from this run; download-artifact extracts it automatically.
      - name: Download and extract wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/push-tmp-wheel-artifact

      - name: Upload all wheels and set properties
        id: upload
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/push-tmp-wheel-artifact
          SOURCE_REPO: ${{ inputs.repo }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_TAG: ${{ inputs.tag }}
          EXTRA_INFO: ${{ inputs.extra_info }}
          GITHUB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: python ci-template/ci-templates/push-tmp-wheel/scripts/push_tmp_wheel.py

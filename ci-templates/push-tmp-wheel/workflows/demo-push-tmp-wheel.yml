name: Demo Push Temporary Wheel

# Copy this file to .github/workflows/demo-push-tmp-wheel.yml in the caller repository.
# Manual runs actually publish to the temporary repository; run only on trusted branches.
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Actual source repository to build, in owner/repo format; defaults to the caller repository'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Source branch, tag, or commit; defaults to the selected workflow ref; set explicitly for another repository'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and save wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: tmp-wheel-${{ github.run_id }}-${{ github.run_attempt }}
      repo: ${{ steps.source.outputs.repo }}
      commit: ${{ steps.source.outputs.commit }}
      branch: ${{ steps.source.outputs.branch }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Check out build source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Record actual build source
        id: source
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repository || github.repository }}
        run: |
          set -euo pipefail
          printf 'repo=%s\n' "$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$(git symbolic-ref --quiet --short HEAD || true)" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$(git tag --points-at HEAD | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: bash
        run: python -m pip install --no-input build

      # Generic Python project example; replace the build environment and command when CUDA, PPU SDK, etc. are required.
      # The project build configuration determines versions; all generated .whl files are uploaded unchanged.
      - name: Build wheel
        shell: bash
        run: python -m build --wheel --outdir "$RUNNER_TEMP/push-tmp-wheel-dist"

      - name: Save wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmp-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/push-tmp-wheel-dist/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Call temporary wheel upload template
    needs: build
    # For production, replace both @main and template_ref with the same full commit SHA from the template repository.
    uses: flytiger-eco/shared-workflows/.github/workflows/push-tmp-wheel.yml@main
    with:
      # Use the actual artifact name from the build job output, since run_attempt changes when rerunning only the publishing job.
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      repo: ${{ needs.build.outputs.repo }}
      commit: ${{ needs.build.outputs.commit }}
      branch: ${{ needs.build.outputs.branch }}
      tag: ${{ needs.build.outputs.tag }}
      extra_info: '{"build_tool":"python-build"}'
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      # Enable as needed for private templates, and allow cross-repository calls in the template repository Actions settings.
      # template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show batch directory URL
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to logs and job summary
        shell: bash
        env:
          UPLOAD_URL: ${{ needs.publish.outputs.upload_url }}
        run: |
          set -euo pipefail
          printf 'Batch directory: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
